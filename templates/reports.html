<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta
         name="viewport"
         content="width=device-width, initial-scale=1.0"
      />
      <title>Reports - Parking Management System</title>
      <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
      <script src="https://cdn.tailwindcss.com"></script>
      <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.22.9/babel.min.js"></script>
      <link
         href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css"
         rel="stylesheet"
      />
      <style>
         body {
            margin: 0;
            font-family: "Inter", sans-serif;
         }
         .sidebar {
            transition: transform 0.3s ease;
         }
         .sidebar-hidden {
            transform: translateX(-100%);
         }
         .chart-container {
            height: 300px;
         }
         @media (min-width: 768px) {
            .sidebar {
               transform: translateX(0);
            }
         }
      </style>
   </head>
   <body>
      <div id="root"></div>
      <script type="text/babel">
         const { useState, useEffect } = React;

         const ReportsPage = () => {
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [reportPeriod, setReportPeriod] = useState("week");

            const toggleSidebar = () => setIsSidebarOpen(!isSidebarOpen);

            useEffect(() => {
               // Initialize charts
               const ctx1 = document
                  .getElementById("occupancyTrendChart")
                  .getContext("2d");
               const ctx2 = document
                  .getElementById("revenueTrendChart")
                  .getContext("2d");

               new Chart(ctx1, {
                  type: "line",
                  data: {
                     labels: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
                     datasets: [
                        {
                           label: "Average Occupancy",
                           data: [65, 70, 80, 75, 85, 90, 70],
                           borderColor: "#4723D9",
                           tension: 0.4,
                        },
                     ],
                  },
                  options: {
                     responsive: true,
                     maintainAspectRatio: false,
                  },
               });

               new Chart(ctx2, {
                  type: "bar",
                  data: {
                     labels: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
                     datasets: [
                        {
                           label: "Daily Revenue",
                           data: [
                              12000, 19000, 15000, 17000, 22000, 25000, 20000,
                           ],
                           backgroundColor: "#4723D9",
                        },
                     ],
                  },
                  options: {
                     responsive: true,
                     maintainAspectRatio: false,
                  },
               });
            }, []);

            return (
               <div className="min-h-screen bg-gray-100">
                  {/* Header */}
                  <header className="fixed top-0 left-0 right-0 bg-white shadow-md h-16 flex items-center justify-between px-4 z-50">
                     <button
                        onClick={toggleSidebar}
                        className="text-2xl"
                     >
                        <i
                           className={`bx ${
                              isSidebarOpen ? "bx-x" : "bx-menu"
                           }`}
                        ></i>
                     </button>
                     <h1 className="text-lg font-semibold">
                        NEW MARS Parking Management System
                     </h1>
                     <i className="bx bx-user text-2xl"></i>
                  </header>

                  {/* Sidebar */}
                  <nav
                     className={`fixed top-16 left-0 h-full bg-indigo-600 w-64 transform ${
                        isSidebarOpen ? "" : "sidebar-hidden"
                     } transition-transform z-40`}
                  >
                     <div className="flex flex-col h-full p-4">
                        <a
                           href="/"
                           className="flex items-center text-white py-2 px-3 rounded mb-2 hover:bg-indigo-700"
                        >
                           <i className="bx bx-grid-alt mr-3"></i>
                           <span>Dashboard</span>
                        </a>
                        <a
                           href="/payments"
                           className="flex items-center text-white py-2 px-3 rounded mb-2 hover:bg-indigo-700"
                        >
                           <i className="bx bx-money mr-3"></i>
                           <span>Payments</span>
                        </a>
                        <a
                           href="/reports"
                           className="flex items-center text-white py-2 px-3 rounded mb-2 bg-indigo-700"
                        >
                           <i className="bx bx-message-square-detail mr-3"></i>
                           <span>Reports</span>
                        </a>
                        <a
                           href="/settings"
                           className="flex items-center text-white py-2 px-3 rounded mb-2 hover:bg-indigo-700"
                        >
                           <i className="bx bx-cog mr-3"></i>
                           <span>Settings</span>
                        </a>
                     </div>
                  </nav>

                  {/* Main Content */}
                  <main
                     className={`mt-16 ${
                        isSidebarOpen ? "md:ml-64" : ""
                     } p-6 transition-all duration-300`}
                  >
                     <div className="max-w-7xl mx-auto">
                        {/* Period Selection */}
                        <div className="mb-6">
                           <div className="bg-white rounded-xl shadow-sm p-4 flex items-center space-x-4">
                              <span className="text-gray-600">
                                 Report Period:
                              </span>
                              <select
                                 value={reportPeriod}
                                 onChange={(e) =>
                                    setReportPeriod(e.target.value)
                                 }
                                 className="border rounded px-3 py-1"
                              >
                                 <option value="week">Last 7 Days</option>
                                 <option value="month">Last 30 Days</option>
                                 <option value="year">Last Year</option>
                              </select>
                           </div>
                        </div>

                        {/* Charts Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                           <div className="bg-white rounded-xl shadow-sm p-6">
                              <h3 className="text-lg font-semibold mb-4">
                                 Occupancy Trend
                              </h3>
                              <div className="chart-container">
                                 <canvas id="occupancyTrendChart"></canvas>
                              </div>
                           </div>
                           <div className="bg-white rounded-xl shadow-sm p-6">
                              <h3 className="text-lg font-semibold mb-4">
                                 Revenue Trend
                              </h3>
                              <div className="chart-container">
                                 <canvas id="revenueTrendChart"></canvas>
                              </div>
                           </div>
                        </div>

                        {/* Summary Stats */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                           <div className="bg-white rounded-xl shadow-sm p-6">
                              <h4 className="text-gray-500 mb-2">
                                 Total Revenue
                              </h4>
                              <div className="text-2xl font-bold">
                                 RWF 130,000
                              </div>
                              <div className="text-green-600 text-sm mt-2">
                                 <i className="bx bx-up-arrow-alt"></i> 12% vs
                                 last period
                              </div>
                           </div>
                           <div className="bg-white rounded-xl shadow-sm p-6">
                              <h4 className="text-gray-500 mb-2">
                                 Average Daily Vehicles
                              </h4>
                              <div className="text-2xl font-bold">85</div>
                              <div className="text-green-600 text-sm mt-2">
                                 <i className="bx bx-up-arrow-alt"></i> 8% vs
                                 last period
                              </div>
                           </div>
                           <div className="bg-white rounded-xl shadow-sm p-6">
                              <h4 className="text-gray-500 mb-2">
                                 Peak Occupancy Rate
                              </h4>
                              <div className="text-2xl font-bold">92%</div>
                              <div className="text-yellow-600 text-sm mt-2">
                                 <i className="bx bx-right-arrow-alt"></i> 3% vs
                                 last period
                              </div>
                           </div>
                        </div>
                     </div>
                  </main>
               </div>
            );
         };

         ReactDOM.render(<ReportsPage />, document.getElementById("root"));
      </script>
   </body>
</html>
