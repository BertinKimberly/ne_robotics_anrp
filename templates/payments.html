<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta
         name="viewport"
         content="width=device-width, initial-scale=1.0"
      />
      <title>Payments - Parking Management System</title>
      <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
      <script src="https://cdn.tailwindcss.com"></script>
      <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.22.9/babel.min.js"></script>
      <link
         href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css"
         rel="stylesheet"
      />
      <style>
         body {
            margin: 0;
            font-family: "Inter", sans-serif;
         }
         .sidebar {
            transition: transform 0.3s ease;
         }
         .sidebar-hidden {
            transform: translateX(-100%);
         }
         @media (min-width: 768px) {
            .sidebar {
               transform: translateX(0);
            }
         }
      </style>
   </head>
   <body>
      <div id="root"></div>
      <script type="text/babel">
         const { useState, useEffect } = React;

         const PaymentsPage = () => {
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [payments, setPayments] = useState([]);

            const toggleSidebar = () => setIsSidebarOpen(!isSidebarOpen);

            const fetchPayments = () => {
               fetch("/api/payments")
                  .then((res) => res.json())
                  .then((data) => setPayments(data))
                  .catch((err) =>
                     console.error("Error fetching payments:", err)
                  );
            };

            useEffect(() => {
               // Initial fetch
               fetchPayments();

               // Set up periodic refresh every 5 seconds
               const intervalId = setInterval(fetchPayments, 5000);

               // Cleanup interval on component unmount
               return () => clearInterval(intervalId);
            }, []);

            return (
               <div className="min-h-screen bg-gray-100">
                  {/* Header */}
                  <header className="fixed top-0 left-0 right-0 bg-white shadow-md h-16 flex items-center justify-between px-4 z-50">
                     <button
                        onClick={toggleSidebar}
                        className="text-2xl"
                     >
                        <i
                           className={`bx ${
                              isSidebarOpen ? "bx-x" : "bx-menu"
                           }`}
                        ></i>
                     </button>
                     <h1 className="text-lg font-semibold">
                        NEW MARS Parking Management System
                     </h1>
                     <i className="bx bx-user text-2xl"></i>
                  </header>

                  {/* Sidebar */}
                  <nav
                     className={`fixed top-16 left-0 h-full bg-indigo-600 w-64 transform ${
                        isSidebarOpen ? "" : "sidebar-hidden"
                     } transition-transform z-40`}
                  >
                     <div className="flex flex-col h-full p-4">
                        <a
                           href="/"
                           className="flex items-center text-white py-2 px-3 rounded mb-2 hover:bg-indigo-700"
                        >
                           <i className="bx bx-grid-alt mr-3"></i>
                           <span>Dashboard</span>
                        </a>
                        <a
                           href="/payments"
                           className="flex items-center text-white py-2 px-3 rounded mb-2 bg-indigo-700"
                        >
                           <i className="bx bx-money mr-3"></i>
                           <span>Payments</span>
                        </a>
                        <a
                           href="/reports"
                           className="flex items-center text-white py-2 px-3 rounded mb-2 hover:bg-indigo-700"
                        >
                           <i className="bx bx-message-square-detail mr-3"></i>
                           <span>Reports</span>
                        </a>
                        <a
                           href="/settings"
                           className="flex items-center text-white py-2 px-3 rounded mb-2 hover:bg-indigo-700"
                        >
                           <i className="bx bx-cog mr-3"></i>
                           <span>Settings</span>
                        </a>
                     </div>
                  </nav>

                  {/* Main Content */}
                  <main
                     className={`mt-16 ${
                        isSidebarOpen ? "md:ml-64" : ""
                     } p-6 transition-all duration-300`}
                  >
                     <div className="max-w-7xl mx-auto">
                        <div className="bg-white rounded-xl shadow-sm p-6">
                           <h2 className="text-2xl font-semibold mb-6">
                              Payment History
                           </h2>
                           <div className="overflow-x-auto">
                              <table className="w-full">
                                 <thead>
                                    <tr className="text-left text-gray-500 border-b">
                                       <th className="pb-3">Transaction ID</th>
                                       <th className="pb-3">Vehicle Plate</th>
                                       <th className="pb-3">Amount</th>
                                       <th className="pb-3">Status</th>
                                       <th className="pb-3">Date</th>
                                       <th className="pb-3">Actions</th>
                                    </tr>
                                 </thead>
                                 <tbody>
                                    {payments.map((payment, idx) => (
                                       <tr
                                          key={idx}
                                          className="border-b"
                                       >
                                          <td className="py-3">
                                             {payment.transaction_id}
                                          </td>
                                          <td className="py-3">
                                             {payment.plate_number}
                                          </td>
                                          <td className="py-3">
                                             RWF{" "}
                                             {payment.amount.toLocaleString()}
                                          </td>
                                          <td className="py-3">
                                             <span
                                                className={`px-2 py-1 rounded text-xs font-semibold ${
                                                   payment.status ===
                                                   "completed"
                                                      ? "bg-green-100 text-green-800"
                                                      : payment.status ===
                                                        "pending"
                                                      ? "bg-yellow-100 text-yellow-800"
                                                      : "bg-red-100 text-red-800"
                                                }`}
                                             >
                                                {payment.status
                                                   .charAt(0)
                                                   .toUpperCase() +
                                                   payment.status.slice(1)}
                                             </span>
                                          </td>
                                          <td className="py-3">
                                             {new Date(
                                                payment.date
                                             ).toLocaleString()}
                                          </td>
                                          <td className="py-3">
                                             <button className="text-indigo-600 hover:text-indigo-800">
                                                <i className="bx bx-receipt mr-1"></i>
                                                View Receipt
                                             </button>
                                          </td>
                                       </tr>
                                    ))}
                                 </tbody>
                              </table>
                           </div>
                        </div>
                     </div>
                  </main>
               </div>
            );
         };

         ReactDOM.render(<PaymentsPage />, document.getElementById("root"));
      </script>
   </body>
</html>
